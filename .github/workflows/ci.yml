name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci -f
      - name: Lint
        run: npm run lint --if-present
      # - name: Test
      #   run: npm test --silent
      - name: Build
        run: npm run build --if-present

      # Deploy main branch to root
      - name: Deploy main to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: nilesh-sutar.github.io

      # Deploy feature branches to subdirectories
      - name: Deploy feature branch to GitHub Pages
        if: startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name }}
