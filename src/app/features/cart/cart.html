@if(cartStore.products().length === 0) {
<p>Your cart is empty.</p>
<a routerLink="/products">Explore Products</a>
}
@else {
<table class="table table-light">
    <tbody>
        @for (item of cartStore.products(); track item.id) {
        <tr>
            <td><img class="img-thumbnail" [routerLink]="'/products/' + item.id" [src]="item.image" alt=""></td>
            <td><a [routerLink]="'/products/' + item.id">{{ item.title }}</a></td>
            <td>{{ item.price }}</td>
            <td>
                <button class="btn btn-danger btn-sm" (click)="onRemove(item)">Remove</button>
            </td>
            <td>
                <button class="btn btn-danger btn-sm"
                    (click)="item.quantity !== 1 ? cartStore.decrementQuantity(item) : onRemove(item)">-</button>
                {{ item.quantity }}
                <button class="btn btn-danger btn-sm" (click)="cartStore.incrementQuantity(item)">+</button>
            </td>
        </tr>
        }
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3"><strong>Total:</strong> {{ cartStore.totalPrice() | currency}}</td>
            <td>
                <button class="btn btn-warning" (click)="cartStore.emptyCart()">Empty Cart</button>
            </td>
            <td>
                <button class="btn btn-warning">Checkout</button>
            </td>
        </tr>
    </tfoot>
</table>
}
