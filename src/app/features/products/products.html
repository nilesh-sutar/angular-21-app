<div class="products">
    <h2>Products</h2>
    <div class="row my-2">
        @for (product of products$ | async; track product.id) {
        <div class="col-md-4">
            <app-product-card [product]="product" (handleAdd)="onAdd($event)" />
        </div>
        }
    </div>
    @if (productsError$ | async) {
    <div class="alert alert-danger" role="alert">
        Error loading products: {{ productsError$ | async }}
    </div>
    }
</div>
