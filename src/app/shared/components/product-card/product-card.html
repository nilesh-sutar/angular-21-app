<div class="card mb-4">
    <img class="card-img-top img-fluid mx-auto cursor-pointer" routerLink="/products/{{ product()?.id }}"
        [src]="product()?.image" alt="Card image">
    <div class="card-body">
        <h6 class="card-title text-truncate">{{ product()?.title }}</h6>
        <p class="card-text text-truncate">{{ product()?.description }}</p>
        <p>Category: {{ product()?.category }}</p>
        <p>Price: ${{ product()?.price }}</p>
        <div class="d-flex justify-content-between">
            @if(config().showAddToCart) {
            @if (isInCart() === false){
            <app-button [config]="{color:'primary', label: buttonLabel()}" (onClick)="onAdd(product())">
                <span class="material-icons" icon>
                    add_shopping_cart
                </span>
            </app-button>
            } @else {
            <app-button [config]="{color:'warning', label: 'Go to cart'}" (onClick)="navigateTo('/cart')">
                <span class="material-icons" icon>
                    arrow_outward
                </span>
            </app-button>
            }
            }
        </div>
    </div>

</div>
